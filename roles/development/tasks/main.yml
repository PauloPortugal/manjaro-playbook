---
- name: Install Developer Tools
  community.general.pacman:
    name: "{{ developer_stack }}"
    state: present
  become_user: root
  become: true
  tags:
    - dev-tools
    - development

- name: Configure Go
  ansible.builtin.import_tasks: go.yml

- name: Install Developer Tools from Arch User Repository
  ansible.builtin.shell: |
    set -o pipefail
    pamac build -d --no-confirm {{ item }} | grep "is up to date"
    if [ $? != 0 ]; then
      pamac build --no-confirm {{ item }}
    fi
  loop: "{{ developer_stack_aur }}"
  register: command_result
  failed_when: command_result.rc != 0
  changed_when: "'successfully' in command_result.stdout"
  tags:
    - dev-tools-aur
    - development-aur
    - development
    - aur

- name: Install nvm
  ansible.builtin.import_tasks: nvm.yml

- name: Configure docker
  ansible.builtin.import_tasks: docker-config.yml

- name: Configure Emacs
  ansible.builtin.import_tasks: emacs-config.yml

- name: Configure Tesseract
  ansible.builtin.import_tasks: tesseract.yml

---
- name: Install editors
  community.general.pacman:
    name: "{{ editors }}"
    state: present
  become: true
  tags:
    - editors

- name: Install editors from Arch User Repository
  ansible.builtin.shell: |
    set -o pipefail
    pamac build -d --no-confirm {{ item }} | grep "is up to date"
    if [ $? != 0 ]; then
      pamac build --no-confirm {{ item }}
    fi
  loop: "{{ editors_aur }}"
  register: command_result
  failed_when: command_result.rc != 0
  changed_when: "'successfully' in command_result.stdout"
  tags:
    - aur
    - editors_aur

- name: Setup default Git configuration
  community.general.git_config:
    name: "{{ item.name }}"
    scope: global
    value: "{{ item.value }}"
  loop:
    - {name: user.name, value: "{{ user_git_name }}"}
    - {name: user.email, value: "{{ user_email }}"}
    - {name: core.editor, value: vim}
  become_user: "{{ user_name }}"
  become: true
  tags:
    - git
